name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and verify (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned downloads are ~200 MB; keyed on upstream.json so a version bump refetches.
      - uses: actions/cache@v4
        with:
          path: cache/*.zip
          key: upstream-${{ hashFiles('upstream.json') }}
      # Signs the programs when a signing command is configured (README, "Code signing"). Forks,
      # and pull requests from them, have no secrets and build unsigned.
      - run: node build/build.mjs
        env:
          ENKI_SIGN_COMMAND: ${{ secrets.ENKI_SIGN_COMMAND }}
      - run: npm run verify
      - run: node test/setup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: enki-browser-windows-x64
          path: |
            out/EnkiBrowserSetup-*.exe
            out/EnkiBrowserSetup-*.exe.sha256
            out/EnkiBrowser-*-windows-x64.zip
            out/EnkiBrowser-*-windows-x64.zip.sha256
          retention-days: 14

  updater:
    name: Updater end to end (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: cache/*.zip
          key: upstream-${{ hashFiles('upstream.json') }}
      # Builds two throwaway versions signed with a throwaway key, then checks every refusal
      # (forged signature, tampered zip, downgrade), no swap under a running browser, and a real
      # update that keeps the profile.
      - run: node test/update.mjs

  linux:
    name: Build and verify (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: cache/*.tar.xz
          key: upstream-linux-${{ hashFiles('upstream.json') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb unzip xz-utils
      - run: node build/build-linux.mjs
      # Installed the way a user would, without root, plus the AppArmor profile Ubuntu 24.04 needs;
      # then verified with Chromium's sandbox on, as on a real desktop.
      - name: Install from the tar.gz and verify
        run: |
          tmp=$(mktemp -d) && tar -xzf out/enki-browser-*-linux-x64.tar.gz -C "$tmp"
          "$tmp/enki-browser/install.sh" --apparmor
          ENKI_LINUX_DIR="$HOME/.local/opt/enki-browser" xvfb-run -a node test/verify.mjs
      # The .deb on clean systems: dependencies resolve, the browser renders, removal is clean.
      - run: docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/test:/t:ro" ubuntu:24.04 bash /t/linux-deb.sh
      - run: docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/test:/t:ro" debian:12 bash /t/linux-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: enki-browser-linux-x64
          path: |
            out/enki-browser-*-linux-x64.tar.gz
            out/enki-browser-*-linux-x64.tar.gz.sha256
            out/enki-browser_*_amd64.deb
            out/enki-browser_*_amd64.deb.sha256
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, updater, linux]
    runs-on: ubuntu-latest
    # The only job allowed to write, and only for a tag pushed by a maintainer.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: enki-browser-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: enki-browser-linux-x64
          path: dist
      # The update manifest is what installed browsers trust; it is signed here, with a key that
      # exists only as this secret, and checked against config/update-signing.pub before upload.
      - name: Sign the update manifest, write the Scoop manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          zip=$(ls dist/EnkiBrowser-*-windows-x64.zip)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$zip")"
          node build/sign-update.mjs "$zip" "$url"
          node build/scoop-manifest.mjs "$zip" "$url"
      # Published as the latest release (not a pre-release) so that
      # releases/latest/download/enki-browser.json — the Scoop install URL — always resolves.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest \
            --title "Enki Browser $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            dist/EnkiBrowserSetup-*.exe dist/EnkiBrowserSetup-*.exe.sha256 \
            dist/EnkiBrowser-*-windows-x64.zip dist/EnkiBrowser-*-windows-x64.zip.sha256 \
            dist/enki-browser-*-linux-x64.tar.gz dist/enki-browser-*-linux-x64.tar.gz.sha256 \
            dist/enki-browser_*_amd64.deb dist/enki-browser_*_amd64.deb.sha256 \
            dist/enki-browser.json dist/update.json dist/update.json.sig

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A sign-off is the contributor stating they may submit the change under the project's
      # license (https://developercertificate.org). Lighter than a CLA, which keeps casual
      # contributors away. `git commit -s` adds it.
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Fix with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
