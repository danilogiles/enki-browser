name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and verify (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned downloads are ~200 MB; keyed on upstream.json so a version bump refetches.
      - uses: actions/cache@v4
        with:
          path: cache/*.zip
          key: upstream-${{ hashFiles('upstream.json') }}
      - run: node build/build.mjs
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: enki-browser-windows-x64
          path: |
            out/EnkiBrowser-*-windows-x64.zip
            out/EnkiBrowser-*-windows-x64.zip.sha256
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    # The only job allowed to write, and only for a tag pushed by a maintainer.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: enki-browser-windows-x64
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Enki Browser $GITHUB_REF_NAME" \
            --notes "Early alpha for Windows x64. Install: extract, run 'Install Enki Browser.cmd'. Check the zip against its .sha256. Read Known gaps in the README first." \
            EnkiBrowser-*-windows-x64.zip EnkiBrowser-*-windows-x64.zip.sha256
