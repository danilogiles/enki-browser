name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: "Also build an Authenticode-signed Windows edition (main only; needs the code-signing environment's approval)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and verify (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned downloads are ~200 MB; keyed on upstream.json so a version bump refetches.
      - uses: actions/cache@v4
        with:
          path: cache/*.zip
          key: upstream-${{ hashFiles('upstream.json') }}
      # Signs the programs when a signing command is configured (README, "Code signing"). Forks,
      # and pull requests from them, have no secrets and build unsigned.
      - run: node build/build.mjs
        env:
          ENKI_SIGN_COMMAND: ${{ secrets.ENKI_SIGN_COMMAND }}
      - run: npm run verify
      - run: node test/session.mjs
      - run: node test/setup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: enki-browser-windows-x64
          path: |
            out/EnkiBrowserSetup-*.exe
            out/EnkiBrowserSetup-*.exe.sha256
            out/EnkiBrowser-*-windows-x64.zip
            out/EnkiBrowser-*-windows-x64.zip.sha256
          retention-days: 14

  updater:
    name: Updater end to end (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: cache/*.zip
          key: upstream-${{ hashFiles('upstream.json') }}
      # Builds two throwaway versions signed with a throwaway key, then checks every refusal
      # (forged signature, tampered zip, downgrade), no swap under a running browser, and a real
      # update that keeps the profile.
      - run: node test/update.mjs

  linux:
    name: Build and verify (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: cache/*.tar.xz
          key: upstream-linux-${{ hashFiles('upstream.json') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb unzip xz-utils
      - run: node build/build-linux.mjs
      # Installed the way a user would, without root, plus the AppArmor profile Ubuntu 24.04 needs;
      # then verified with Chromium's sandbox on, as on a real desktop.
      - name: Install from the tar.gz and verify
        run: |
          tmp=$(mktemp -d) && tar -xzf out/enki-browser-*-linux-x64.tar.gz -C "$tmp"
          "$tmp/enki-browser/install.sh" --apparmor
          ENKI_LINUX_DIR="$HOME/.local/opt/enki-browser" xvfb-run -a node test/verify.mjs
          ENKI_LINUX_DIR="$HOME/.local/opt/enki-browser" xvfb-run -a node test/session.mjs
      # The .deb on clean systems: dependencies resolve, the browser renders, removal is clean.
      - run: docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/test:/t:ro" ubuntu:24.04 bash /t/linux-deb.sh
      - run: docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/test:/t:ro" debian:12 bash /t/linux-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: enki-browser-linux-x64
          path: |
            out/enki-browser-*-linux-x64.tar.gz
            out/enki-browser-*-linux-x64.tar.gz.sha256
            out/enki-browser_*_amd64.deb
            out/enki-browser_*_amd64.deb.sha256
          retention-days: 14

  macos:
    name: Build and verify (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: cache/*.dmg
          key: upstream-mac-${{ matrix.arch }}-${{ hashFiles('upstream.json') }}
      - run: node build/build-mac.mjs --arch=${{ matrix.arch }}
      # Installed the way a user would, from the .dmg into an Applications folder, and verified on
      # the architecture it was built for. The mock keychain only spares the unattended runner a
      # keychain prompt nobody would answer.
      - name: Install from the .dmg and verify
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" out/EnkiBrowser-*-macos-${{ matrix.arch }}.dmg
          mkdir -p "$HOME/Applications"
          ditto "$mnt/Enki Browser.app" "$HOME/Applications/Enki Browser.app"
          hdiutil detach "$mnt"
          ENKI_MAC_APP="$HOME/Applications/Enki Browser.app" ENKI_MOCK_KEYCHAIN=1 node test/verify.mjs
          ENKI_MAC_APP="$HOME/Applications/Enki Browser.app" ENKI_MOCK_KEYCHAIN=1 node test/session.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: enki-browser-macos-${{ matrix.arch }}
          path: |
            out/EnkiBrowser-*-macos-${{ matrix.arch }}.dmg
            out/EnkiBrowser-*-macos-${{ matrix.arch }}.dmg.sha256
          retention-days: 14

  # Authenticode signing with Azure Artifact Signing. Off until the repository variable
  # ARTIFACT_SIGNING_ENDPOINT is set; then only for a v* tag, or a manual run on main with "sign"
  # ticked. Never for pull requests (forks or not). It runs in the protected `code-signing`
  # environment (required reviewer; main and v* tags only), whose OIDC subject is the only one the
  # Azure federated credential trusts, so no other job or ref can get a signing token. It holds no
  # client secret and not the update-manifest key (that stays in the release job).
  # Signed: EnkiBrowser.exe (stub), EnkiBrowserLauncher.exe, EnkiBrowserSetup-<ver>.exe — the
  # programs this project compiles. Never chrome.exe or any other ungoogled-chromium file.
  windows-signed:
    name: Build, sign and verify (Windows x64, signed)
    if: >-
      vars.ARTIFACT_SIGNING_ENDPOINT != '' &&
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign))
    runs-on: windows-latest
    timeout-minutes: 45
    environment: code-signing
    permissions:
      contents: read
      id-token: write
    env:
      # One signer at a time: the generic hook stays off here, Azure signs.
      ENKI_SIGN_COMMAND: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Read-only: this job may reuse the upstream downloads but never writes a cache. build.mjs
      # refuses any file whose sha256 differs from upstream.json anyway.
      - uses: actions/cache/restore@v4
        with:
          path: cache/*.zip
          key: upstream-${{ hashFiles('upstream.json') }}
      - name: Paths
        id: paths
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $o = Join-Path $env:GITHUB_WORKSPACE 'out'
          "version=$v" >> $env:GITHUB_OUTPUT
          "stub=$o\EnkiBrowser\EnkiBrowser.exe" >> $env:GITHUB_OUTPUT
          "launcher=$o\EnkiBrowser\app\$v\EnkiBrowserLauncher.exe" >> $env:GITHUB_OUTPUT
          "setup=$o\EnkiBrowserSetup-$v.exe" >> $env:GITHUB_OUTPUT
      - name: Build up to the stub and the launcher
        run: node build/build.mjs --phase=programs
      - name: Azure login (OIDC, no secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      # Exactly two files, by path: before packaging, so the zip and the installer carry them signed.
      - name: Sign the stub and the launcher
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ steps.paths.outputs.stub }}
            ${{ steps.paths.outputs.launcher }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Enki Browser
          description-url: ${{ github.server_url }}/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Pack the zip and the installer
        run: node build/build.mjs --phase=package
      - name: Sign the installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.paths.outputs.setup }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Enki Browser Setup
          description-url: ${{ github.server_url }}/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      # Done with Azure: nothing after this point can ask for a signature.
      - name: Azure logout
        if: always()
        shell: pwsh
        run: |
          az logout 2>$null
          az account clear 2>$null
          exit 0
      - name: Checksums over the signed bytes
        run: node build/build.mjs --phase=checksums
      # Fails the job (so no release) if a file that must be signed is not, or if anything from
      # Chromium carries this project's certificate — in out/, in the zip and inside the installer's zip.
      - name: Verify signatures
        shell: pwsh
        env:
          ENKI_VERSION_DIR: ${{ steps.paths.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $v = $env:ENKI_VERSION_DIR
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          $zip = Join-Path $out "EnkiBrowser-$v-windows-x64.zip"
          $setup = Join-Path $out "EnkiBrowserSetup-$v.exe"
          $fail = @()
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1

          # What ships, unpacked from the zip, so the check covers the packed copies too.
          $unz = Join-Path $env:RUNNER_TEMP 'enki-zip'
          Remove-Item $unz -Recurse -Force -ErrorAction SilentlyContinue
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($e in $archive.Entries) {
              if ($e.FullName -match '\.(exe|dll)$') {
                $dest = Join-Path $unz ($e.FullName -replace '/', '\')
                New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, $dest, $true)
              }
            }
          } finally { $archive.Dispose() }

          $mustSign = @(
            $setup,
            "$out\EnkiBrowser\EnkiBrowser.exe",
            "$out\EnkiBrowser\app\$v\EnkiBrowser.exe",
            "$out\EnkiBrowser\app\$v\EnkiBrowserLauncher.exe",
            "$unz\EnkiBrowser\EnkiBrowser.exe",
            "$unz\EnkiBrowser\app\$v\EnkiBrowser.exe",
            "$unz\EnkiBrowser\app\$v\EnkiBrowserLauncher.exe"
          )
          $subject = $null
          foreach ($f in $mustSign) {
            if (-not (Test-Path $f)) { $fail += "missing: $f"; continue }
            $s = Get-AuthenticodeSignature -FilePath $f
            if ($s.Status -ne 'Valid') { $fail += "not validly signed ($($s.Status)): $f"; continue }
            if (-not $s.TimeStamperCertificate) { $fail += "signed without a timestamp: $f" }
            if (-not $subject) { $subject = $s.SignerCertificate.Subject }
            elseif ($s.SignerCertificate.Subject -ne $subject) { $fail += "different signer ($($s.SignerCertificate.Subject)): $f" }
            if ($signtool) {
              $log = & $signtool.FullName verify /pa /v $f 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) { $fail += "signtool verify /pa failed: $f" }
              elseif ($log -notmatch '(?i)sha256') { Write-Warning "signtool did not report a SHA-256 digest for $f" }
            }
            Write-Host "signed: $f"
          }
          if (-not $signtool) { Write-Warning 'signtool.exe not found; relied on Get-AuthenticodeSignature only.' }
          Write-Host "publisher: $subject"

          # Nothing from ungoogled-chromium may carry our certificate, chrome.exe above all.
          $chromium = @("$out\EnkiBrowser\app\$v\chromium", "$unz\EnkiBrowser\app\$v\chromium")
          foreach ($dir in $chromium) {
            if (-not (Test-Path "$dir\chrome.exe")) { $fail += "missing: $dir\chrome.exe" }
            if (-not $subject) { continue }
            Get-ChildItem $dir -Recurse -File -Include *.exe, *.dll | ForEach-Object {
              $s = Get-AuthenticodeSignature -FilePath $_.FullName
              if ($s.SignerCertificate -and $s.SignerCertificate.Subject -eq $subject) {
                $fail += "upstream file signed with our certificate: $($_.FullName)"
              }
            }
          }

          # The .sha256 files describe the signed bytes.
          foreach ($f in @($zip, $setup)) {
            $want = ((Get-Content "$f.sha256" -Raw) -split '\s+')[0]
            $have = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            if ($want -ne $have) { $fail += "checksum does not match the file: $f.sha256" }
          }

          if ($fail.Count) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'All Enki programs are signed; no Chromium file is.'
      - run: npm run verify
      - run: node test/session.mjs
      - run: node test/setup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: enki-browser-windows-x64-signed
          path: |
            out/EnkiBrowserSetup-*.exe
            out/EnkiBrowserSetup-*.exe.sha256
            out/EnkiBrowser-*-windows-x64.zip
            out/EnkiBrowser-*-windows-x64.zip.sha256
          retention-days: 14

  release:
    name: Publish release
    # With signing configured (ARTIFACT_SIGNING_ENDPOINT set), a release needs the signed build
    # and ships it; without it, the unsigned build as before. Never a silent fallback to unsigned.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.windows.result == 'success' && needs.updater.result == 'success' && needs.linux.result == 'success' &&
      needs.macos.result == 'success' &&
      ((vars.ARTIFACT_SIGNING_ENDPOINT != '' && needs.windows-signed.result == 'success') ||
       (vars.ARTIFACT_SIGNING_ENDPOINT == '' && needs.windows-signed.result == 'skipped'))
    needs: [windows, windows-signed, updater, linux, macos]
    runs-on: ubuntu-latest
    # The only job allowed to write, and only for a tag pushed by a maintainer.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-signed.result == 'success' && 'enki-browser-windows-x64-signed' || 'enki-browser-windows-x64' }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: enki-browser-linux-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: enki-browser-macos-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: enki-browser-macos-x64
          path: dist
      # The .sha256 files were written after Authenticode signing; recheck them here, in the job
      # that holds the update key, before anything is derived from these bytes.
      - name: Check the downloaded files against their checksums
        run: cd dist && sha256sum -c -- *.sha256
      # The update manifest is what installed browsers trust; it is signed here, with a key that
      # exists only as this secret, and checked against config/update-signing.pub before upload.
      - name: Sign the update manifest, write the Scoop manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          zip=$(ls dist/EnkiBrowser-*-windows-x64.zip)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$zip")"
          node build/sign-update.mjs "$zip" "$url"
          node build/scoop-manifest.mjs "$zip" "$url"
      # The installer, the .deb and the .dmgs also go up under names without the version, so
      # releases/latest/download/EnkiBrowserSetup.exe is a download link that never goes stale
      # (the README's and anyone else's). The versioned files stay for checksums and history.
      - name: Copies under stable names
        run: |
          cp dist/EnkiBrowserSetup-*.exe dist/EnkiBrowserSetup.exe
          cp dist/enki-browser_*_amd64.deb dist/enki-browser_amd64.deb
          cp dist/EnkiBrowser-*-macos-arm64.dmg dist/EnkiBrowser-macos-arm64.dmg
          cp dist/EnkiBrowser-*-macos-x64.dmg dist/EnkiBrowser-macos-x64.dmg
      # Published as the latest release (not a pre-release) so that
      # releases/latest/download/enki-browser.json — the Scoop install URL — always resolves.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest \
            --title "Enki Browser $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            dist/EnkiBrowserSetup-*.exe dist/EnkiBrowserSetup-*.exe.sha256 \
            dist/EnkiBrowser-*-windows-x64.zip dist/EnkiBrowser-*-windows-x64.zip.sha256 \
            dist/enki-browser-*-linux-x64.tar.gz dist/enki-browser-*-linux-x64.tar.gz.sha256 \
            dist/enki-browser_*_amd64.deb dist/enki-browser_*_amd64.deb.sha256             dist/EnkiBrowser-*-macos-arm64.dmg dist/EnkiBrowser-*-macos-arm64.dmg.sha256             dist/EnkiBrowser-*-macos-x64.dmg dist/EnkiBrowser-*-macos-x64.dmg.sha256 \
            dist/enki-browser.json dist/update.json dist/update.json.sig \
            dist/EnkiBrowserSetup.exe dist/enki-browser_amd64.deb             dist/EnkiBrowser-macos-arm64.dmg dist/EnkiBrowser-macos-x64.dmg

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A sign-off is the contributor stating they may submit the change under the project's
      # license (https://developercertificate.org). Lighter than a CLA, which keeps casual
      # contributors away. `git commit -s` adds it.
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # The extension's history up to its move into extension/ (danilogiles/enkibrowser). Its
          # early commits predate the sign-off rule, and a sign-off is the author's own statement,
          # so it cannot be added for them afterwards. Every commit after this one is checked.
          IMPORTED: f5cce0d9690ee3e26ab12c78a50889313a081c9a
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD" "^$IMPORTED"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Fix with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
