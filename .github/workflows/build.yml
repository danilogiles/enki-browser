name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and verify (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned downloads are ~200 MB; keyed on upstream.json so a version bump refetches.
      - uses: actions/cache@v4
        with:
          path: cache/*.zip
          key: upstream-${{ hashFiles('upstream.json') }}
      # Signs the programs when a signing command is configured (README, "Code signing"). Forks,
      # and pull requests from them, have no secrets and build unsigned.
      - run: node build/build.mjs
        env:
          ENKI_SIGN_COMMAND: ${{ secrets.ENKI_SIGN_COMMAND }}
      - run: npm run verify
      - run: node test/setup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: enki-browser-windows-x64
          path: |
            out/EnkiBrowserSetup-*.exe
            out/EnkiBrowserSetup-*.exe.sha256
            out/EnkiBrowser-*-windows-x64.zip
            out/EnkiBrowser-*-windows-x64.zip.sha256
          retention-days: 14

  updater:
    name: Updater end to end (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: cache/*.zip
          key: upstream-${{ hashFiles('upstream.json') }}
      # Builds two throwaway versions signed with a throwaway key, then checks every refusal
      # (forged signature, tampered zip, downgrade), no swap under a running browser, and a real
      # update that keeps the profile.
      - run: node test/update.mjs

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, updater]
    runs-on: ubuntu-latest
    # The only job allowed to write, and only for a tag pushed by a maintainer.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: enki-browser-windows-x64
          path: dist
      # The update manifest is what installed browsers trust; it is signed here, with a key that
      # exists only as this secret, and checked against config/update-signing.pub before upload.
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          zip=$(ls dist/EnkiBrowser-*-windows-x64.zip)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$zip")"
          node build/sign-update.mjs "$zip" "$url"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Enki Browser $GITHUB_REF_NAME" \
            --notes "Early alpha for Windows x64. Install: run EnkiBrowserSetup (check it against its .sha256); it also upgrades 0.1–0.4 installs. The zip is the same browser for portable use. Installed copies update themselves with signed releases. Read Known gaps in the README first." \
            dist/EnkiBrowserSetup-*.exe dist/EnkiBrowserSetup-*.exe.sha256 \
            dist/EnkiBrowser-*-windows-x64.zip dist/EnkiBrowser-*-windows-x64.zip.sha256 \
            dist/update.json dist/update.json.sig
