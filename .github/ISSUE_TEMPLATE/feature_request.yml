name: Feature request
description: Something Enki Browser should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Open-ended ideas fit better in [Discussions](https://github.com/danilogiles/enki-browser/discussions); this is for concrete proposals.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would work. Mention other browsers that do it well (Brave, DuckDuckGo, Firefox…).
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy
      description: Would it send anything new out of the browser? If so, what and to whom.
