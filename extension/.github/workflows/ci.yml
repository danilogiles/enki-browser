name: CI

on:
  push:
    branches: [main]
  pull_request:

# `pull_request` (not `pull_request_target`) on purpose: a fork's code runs without access to
# secrets or a write token, so a malicious PR cannot reach anything but its own sandbox.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: enki-extension-dist
          path: dist/
          retention-days: 14

  browser:
    name: Extension in Chromium (e2e, resilience, quality)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Stable Chrome refuses --load-extension, so the suites need Playwright's Chromium.
      - run: npx playwright install --with-deps chromium
      - name: Start the mock model
        run: |
          node test/mock-llm.mjs > mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/page >/dev/null && exit 0; sleep 1; done
          cat mock.log; exit 1
      # Extensions only load in headed Chromium; xvfb gives it a display on the runner.
      - run: xvfb-run -a npm run test:e2e
      - run: xvfb-run -a npm run test:home
      - run: xvfb-run -a npm run test:resilience
      - run: xvfb-run -a npm run test:quality
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: |
            test/.out/
            mock.log
          retention-days: 7

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A sign-off is the contributor stating they may submit the change under the project's
      # license (https://developercertificate.org). Lighter than a CLA, which keeps casual
      # contributors away. `git commit -s` adds it.
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Fix with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
