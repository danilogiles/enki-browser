<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enki · Microphone</title>
    <style>
      :root { color-scheme: light dark; --bg: #fcfcf9; --text: #1b1c1b; --muted: #62645f; --accent: #0284c7; }
      @media (prefers-color-scheme: dark) { :root { --bg: #191a1a; --text: #e8e8e6; --muted: #9a9c99; --accent: #38bdf8; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 16px; }
      #status { color: var(--text); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Let Enki hear you</h1>
      <p id="description">Microphone off. Loading the selected audio route…</p>
      <p id="destination"></p>
      <p id="status" role="status">No microphone or provider connection has started.</p>
      <button id="grant" type="button" disabled>Allow microphone permission</button>
      <button id="return" type="button">Return to Enki</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
